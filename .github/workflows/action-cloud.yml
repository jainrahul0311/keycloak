name: Imaging Cloud Analyzer Action

on:
  pull_request:
    types: [closed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug mode: capture results as artifact (success or failure)'
        type: boolean
        default: false

# Least privilege: this job only reads the repo
permissions:
  contents: read

# Don't let overlapping runs on the same ref pile up
concurrency:
  group: imaging-cloud-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGING_CLOUD_ACTION_FILE_VERSION: '1'

jobs:
  run-imaging-cloud-analyzer:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_DIR: deep-analysis/deep-analysis/WorkFolders/LISA

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare results directory
        run: |
          mkdir -p "${RUNNER_TEMP}/results"
          chmod 777 "${RUNNER_TEMP}/results"   # container runs as a different user and needs to write here

      - name: Run Imaging Cloud Action
        env:
          IMAGING_CLOUD_API_KEY: ${{ secrets.IMAGING_CLOUD_API_KEY }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_ID: ${{ github.sha }}
          IMAGING_CLOUD_URL: 'https://dev.castimaging.io'
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/home/carl/extras/source" \
            -v "${RUNNER_TEMP}/results:/home/carl/extras/results" \
            -e IMAGING_CLOUD_API_KEY="$IMAGING_CLOUD_API_KEY" \
            -e REPO_URL="$REPO_URL" \
            -e BRANCH_NAME="$BRANCH_NAME" \
            -e COMMIT_ID="$COMMIT_ID" \
            -e IMAGING_CLOUD_ACTION_FILE_VERSION="$IMAGING_CLOUD_ACTION_FILE_VERSION" \
            -e IMAGING_CLOUD_URL="$IMAGING_CLOUD_URL" \
            castimaging/imaging-cloud-action:dev \
            2>&1 | tee "${RUNNER_TEMP}/results/run.log"

      - name: Zip results (debug mode only)
        if: ${{ always() && inputs.debug }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/results" || true
          cd "${RUNNER_TEMP}/results/$(dirname "${TARGET_DIR}")" || exit 0
          zip -r -9 "${RUNNER_TEMP}/results.zip" "$(basename "${TARGET_DIR}")" || true

      - name: Upload results artifact (debug mode only)
        if: ${{ always() && inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: imaging-results-${{ github.run_id }}
          path: ${{ runner.temp }}/results.zip
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0   # file is already a .zip; skip pointless re-compression
